name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # corepack ÖNCE: setup-node'un 'cache: pnpm' adımı pnpm binary'sini arar,
      # corepack sonra çalışırsa cache adımı 'pnpm bulunamadı' ile düşer.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
